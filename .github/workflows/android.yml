
name: Build Mukushi Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found. Android project files are required."
            exit 1
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Mukushi-Attendance-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
